<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>SWEET. | Online Shop | Cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header-02">

        <div class="header-box-02">
            <a class="header-title" href="index.html">SWEET.</a>

            <div class="header-list-02">
                <nav>
                    <ul>
                        <li><a href="about.html">ABOUT</a></li>
                        <li><a href="menu.html">MENU</a></li>
                        <li><a href="#">CART</a></li>
                    </ul>
                </nav>
            </div>
        </div>

    </header>

    <main>
        <div id="cart-page-emp" class="cart-page-emp hide">
            <h1 class="emp_title">Your Cart is <span>Empty</span></h1>
            <img src="images/cart/plate.png" alt="空のプレート" class="emp_img">

            <a href="menu.html" class="emp_button">Continue shopping...</a>
        </div>

        <div id="cart-page" class="cart-page hide">
            <h1 class="cart-title">Cart</h1>

            <section class="cart-table">
                <div class="orderlist">
                    <p>Prodcut Details</p>
                    <p>Quantity</p>
                    <p>Price</p>
                    <p>Total</p>
                </div>

                <div id="cart-area" class="cart-area"></div>

                <div class="cart-total">
                    <div class="total-box">
                        <h2>Total</h2>
                        <strong>￥<span id="total">0</span></strong>
                    </div>
                    <div class="line-02"></div>
                </div>

                <div class="line cart-line"></div>

                <div class="cart-pay">
                    <h2>Payment Method</h2>

                    <form>
                        <label>
                            <input type="radio" name="paytype" required>
                            クレジットカード
                        </label>
                        <label>
                            <input type="radio" name="paytype">
                            PayPay
                        </label>
                        <label>
                            <input type="radio" name="paytype">
                            銀行振込
                        </label>
                    </form>
                </div>

                <div class="line"></div>
                <button>↼Back</button>
            </section>

            <button id="order-btn" class="cart-order" type="button">Place Order</button>
        </div>
    </main>

    <footer>

        <section class="white">
            <div class="line"></div>

            <h2>SWEET.</h2>

            <div class="Reservation-buuton">
                <a href="menu.html">Reservation</a>
                <div class="Reservation-box-shadow"></div>
            </div>

            <div class="sns">
                <a href="#"><img src="images/home/instagram.png" alt="instagram"></a>
                <a href="#"><img src="images/home/x.png" alt="x"></a>
            </div>

            <small>© 2026 SWEET. Online Shop</small>

            <div class="line"></div>
        </section>

        <section class="pink">
            <a href="about.html">ABOUT</a>
            <p>|</p>
            <a href="menu.html">MENU</a>
            <p>|</p>
            <a href="#">CART</a>
            <p>|</p>
            <a href="news.html">NEWS</a>
        </section>

    </footer>

    <script src="js/product.js"></script>
    <script src="js/script.js"></script>

    <script>
        displayCartPage();
    </script>

</body>

</html>
