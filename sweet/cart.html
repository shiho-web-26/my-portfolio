<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>SWEET.|Online_Shop|cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header_02">

        <div class="header_box_02">
            <a class="header_title" href="index.html">SWEET.</a>

            <div class="header_list_02">
                <nav>
                    <ul>
                        <li><a href="about.html">ABOUT</a></li>
                        <li><a href="menu.html">MENU</a></li>
                        <li><a href="#">CART</a></li>
                    </ul>
                </nav>
            </div>
        </div>

    </header>

    <main>
        <h1 class="cart_title">Cart</h1>

        <section class="cart_table">

            <div class="orderlist">
                <p>Prodcut Details</p>
                <p>Quantity</p>
                <p>Price</p>
                <p>Total</p>
            </div>

            <div id="cartArea"></div>

            <div class="cart_total">
                <div class="total_box">
                    <h2>Total</h2>
                    <strong>￥0</strong>
                </div>
                <div class="line_02"></div>
            </div>

            <div class="line cart_line"></div>

            <div class="cart_pay">
                <h2>Payment Method</h2>

                <form>
                    <label>
                        <input type="radio" name="paytype" required>
                        クレジットカード
                    </label>
                    <label>
                        <input type="radio" name="paytype">
                        PayPay
                    </label>
                    <label>
                        <input type="radio" name="paytype">
                        銀行振込
                    </label>
                </form>
            </div>

            <div class="line"></div>
            <a href="javascript:history.back()">↼Back</a>

        </section>

        <button id="orderBtn" class="cart_order" type="button">Place Order</button>

    </main>

    <footer>

        <section class="white">
            <div class="line"></div>

            <h2>SWEET.</h2>

            <div class="Reservation_buuton">
                <a href="menu.html">Reservation</a>
                <div class="Reservation_box_shadow"></div>
            </div>

            <div class="sns">
                <a href="#"><img src="sweet_images/home/instagram.png" alt="instagram"></a>
                <a href="#"><img src="sweet_images/home/x.png" alt="x"></a>
            </div>

            <small>© 2026 SWEET. Online Shop</small>

            <div class="line"></div>
        </section>

        <section class="pink">
            <a href="about.html">ABOUT</a>
            <p>|</p>
            <a href="menu.html">MENU</a>
            <p>|</p>
            <a href="#">CART</a>
            <p>|</p>
            <a href="news.html">NEWS</a>
        </section>

    </footer>

    <script src="cart.js"></script>

</body>

</html>
