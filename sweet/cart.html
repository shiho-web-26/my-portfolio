<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWEET. | Online Shop | Cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <a class="header-title" href="index.html">SWEET.</a>

        <div class="header-list">
            <nav>
                <ul>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="menu.html">MENU</a></li>
                    <li><a href="cart.html">CART</a></li>
                    <li><a href="news.html">NEWS</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div id="cart-page-emp" class="cart-page-emp hide">
            <h1>Your Cart is <span>Empty</span></h1>
            <img src="images/cart/plate.webp" alt="空のプレート">

            <a href="menu.html">Continue shopping...</a>
        </div>

        <div id="cart-page" class="cart-page hide">
            <h1 class="cart-title">Cart</h1>

            <section class="cart-table">
                <div class="orderlist">
                    <p>Product Details</p>
                    <p>size</p>
                    <p>Quantity</p>
                    <p>Price</p>
                    <p>Total</p>
                </div>

                <div id="cart-area" class="cart-area"></div>

                <div class="cart-total">
                    <div class="total-box">
                        <h2>Total</h2>
                        <strong>￥<span id="total">0</span></strong>
                    </div>
                    <div class="line-02"></div>
                </div>

                <div class="line cart-line"></div>

                <div class="cart-pay">
                    <h2>Payment Method</h2>

                    <form>
                        <label>
                            <input type="radio" name="paytype" required>
                            クレジットカード
                        </label>
                        <label>
                            <input type="radio" name="paytype">
                            PuiPui
                        </label>
                        <label>
                            <input type="radio" name="paytype">
                            銀行振込
                        </label>
                    </form>
                </div>

                <div class="line"></div>
                <button id="back-btn" class="back-btn">↼Back</button>
            </section>

            <button id="order-btn" class="cart-order" type="button">Place Order</button>
        </div>
    </main>

    <footer>
        <section class="footer-main">
            <h2>SWEET.</h2>

            <div class="reservation-button">
                <a href="menu.html">Reservation</a>
            </div>

            <div class="sns">
                <img src="images/index/instagram.webp" alt="Instagram">
                <img src="images/index/x.webp" alt="X">
            </div>

            <p>※本サイトはポートフォリオ用に制作した架空のECサイトです。</p>

            <small>© 2026 SWEET. Online Shop</small>
        </section>

        <nav class="footer-nav">
            <a href="about.html">ABOUT</a>
            <a href="menu.html">MENU</a>
            <a href="cart.html">CART</a>
            <a href="news.html">NEWS</a>
        </nav>
    </footer>

    <script src="js/product.js"></script>
    <script src="js/script.js"></script>

    <script>
        displayCartPage();

        const backBtn = document.getElementById("back-btn");
        backBtn.addEventListener("click", () => {
            history.back();
        });
    </script>

</body>

</html>
